name: FSharp.Interop.Dynamic CodeQL configuration

# CodeQL analyzes the shipped library and GitHub Actions workflows.
#
# Tests/ are excluded deliberately. This library's purpose is runtime
# dispatch through the DLR, so its tests do things static analysis is
# obliged to flag and cannot model. Tests do not ship to consumers.
#
# For the csharp language this file alone is not enough. CodeQL analyzes
# whatever the build extracts, so the workflow also builds only
# FSharp.Interop.Dynamic/FSharp.Interop.Dynamic.fsproj rather than the
# whole solution.
#
# CodeQL has no F# extractor. The csharp job may produce a thin database;
# that is expected, not a misconfiguration.
paths-ignore:
  - Tests/**

name: OSV-Scanner

# Scans the committed packages.lock.json files against OSV.dev, which
# aggregates more advisory sources than the GitHub Advisory Database used
# by NuGet audit and dependency review. Pull requests only; the full scan
# is osv-scanner-full.yml so this workflow does not post a skipped job.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-pr:
    name: OSV-Scanner (new vulnerabilities)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

# Builds the DocFX site on pull requests. Master deploys in docs-pages.yml.
name: Documentation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx --version 2.78.5

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build the library
        run: dotnet build FSharp.Interop.Dynamic/FSharp.Interop.Dynamic.fsproj -c Release --no-restore -warnaserror

      - name: Build the documentation
        run: docfx docfx/docfx.json --warningsAsErrors

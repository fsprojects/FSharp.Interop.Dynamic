name: Pack

# Packs the nupkg on pull requests. Master pack stays in publish.yml so
# Scorecard Packaging still sees nuget push in a file that runs on master.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Pack nupkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Pack
        run: >
          dotnet pack FSharp.Interop.Dynamic.sln
          --configuration Release
          --no-restore
          --output ./nupkgs

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkgs
          path: ./nupkgs/*
          retention-days: 14

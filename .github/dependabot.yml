version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # FSharp.Core in Directory.Packages.props is the published floor, not a
      # version to keep current (issue 80).
      - dependency-name: "FSharp.Core"
    groups:
      test:
        patterns:
          - "xunit*"
          - "Microsoft.Testing.*"
          - "FsUnit*"
          - "coverlet*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies

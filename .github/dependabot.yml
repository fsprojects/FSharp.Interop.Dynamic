version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # FSharp.Core in Directory.Packages.props is the published floor, not a
      # version to keep current (issue 80).
      - dependency-name: "FSharp.Core"
      # xunit.v3 4.x requires Microsoft Testing Platform, which the VSTest-based
      # CI and coverlet collector do not use yet (issue 82).
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
    groups:
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "FsUnit*"
          - "coverlet*"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
